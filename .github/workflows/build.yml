name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Restore
        run: dotnet restore .\nodepunch.slnx

      - name: Build
        run: dotnet build .\nodepunch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\nodepunch.slnx --configuration Release --no-build
